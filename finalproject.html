<div class="item">

</div>
<div class="item">
    <p></p>
    <label for="11">fresh orange juice</label>
    <input type="checkbox" id="11" class="checkbox" data-price="2.99">
    <input type="number" class="amount" data-price="2.99" value="0" min="0" step="1" disabled>
</div>
<p class="subtotal">Subtotal: $<span id="subtotal">0.00</span></p>


<script>

    const checkboxes = document.querySelectorAll('.checkbox');
    // the function of checkboxes is for selected more of one option
    // the function of const is
    const amounts = document.querySelectorAll('.amount');
    // The querySelectorAll() method returns a list of all elements that match a specified CSS selector within an element or document.
    // the function  of amount is for selected more of one  amount
    const subtotalElement = document.getElementById('subtotal');
    //
    checkboxes.forEach(checkbox => {
        // the function of  for each is an iteration function for arrays in JavaScript that runs on each element of an array,
        //allowing you to modify or process the information without affecting the original structure of the array.
        // the function  of => {
        checkbox.addEventListener('change',updateSubtotal);
    // the function of ddEventListener is
        // the function of  update subtotal is for It is to calculate the quantity of the products and update the total.
    amounts.forEach(amount => {
        // .
        amount.addEventListener('input', updateSubtotal);
    // the function of add event listener it is function  that executed when it passed in event.
    });
    function updateSubtotal() {
        //
        let subtotal = 0;
        //
        checkboxes.forEach((checkbox, index) => {
            //
            const amountInput = amounts[index];
            //
            const price = parseFloat(checkbox.getAttribute('data-price'));
            //
            const amount = parseInt(amountInput.value);
            //
            if (checkbox.checked) {
                //
                subtotal += price * amount;
            }
        });
        //
        subtotalElement.textContent = subtotal.toFixed(2);
    }

    // Enable/Disable amount input based on checkbox status
    checkboxes.forEach((checkbox, index) => {
        //
        checkbox.addEventListener('change', () => {
            //
            const amountInput = amounts[index];
            //
            amountInput.disabled = !checkbox.checked;
            //
            if (!checkbox.checked) {
                //
                amountInput.value = 0; // Reset the amount when unchecked
            }
            //
            updateSubtotal(); // Update subtotal when the checkbox state changes
        });
    });
</script>

</body>
