<p class="subtotal">Subtotal: $<span id="subtotal">0.00</span></p>

        <script>
            const checkboxes = document.querySelectorAll('.checkbox');
            const amounts = document.querySelectorAll('.amount');
            const subtotalElement = document.getElementById('subtotal');

            checkboxes.forEach(checkbox => {
                checkbox.addEventListener('change', updateSubtotal);
            });

            amounts.forEach(amount => {
                amount.addEventListener('input', updateSubtotal);
            });

            function updateSubtotal() {
                let subtotal = 0;

                checkboxes.forEach((checkbox, index) => {
                    const amountInput = amounts[index];
                    const price = parseFloat(checkbox.getAttribute('data-price'));
                    const amount = parseInt(amountInput.value);

                    if (checkbox.checked) {
                        subtotal += price * amount;
                    }
                });

                subtotalElement.textContent = subtotal.toFixed(2);
            }

            // Enable/Disable amount input based on checkbox status
            checkboxes.forEach((checkbox, index) => {
                checkbox.addEventListener('change', () => {
                    const amountInput = amounts[index];
                    amountInput.disabled = !checkbox.checked;
                    if (!checkbox.checked) {
                        amountInput.value = 0; // Reset the amount when unchecked
                    }
                    updateSubtotal(); // Update subtotal when the checkbox state changes
                });
            });
        </script>
