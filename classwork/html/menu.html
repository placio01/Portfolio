<!DOCTYPE html>
<html>
<head>
    <title>Calcular Subtotal</title>
</head>
<body>

<label for="precio1">Precio 1:</label>
<input type="number" id="precio1" name="precio1"><br><br>

<label for="precio2">Precio 2:</label>
<input type="number" id="precio2" name="precio2"><br><br>

<button onclick="calcularSubtotal()">Calcular Subtotal</button>

<p>Subtotal: <span id="subtotal"></span></p>

<script>
    function calcularSubtotal() {
        let precio1 = parseFloat(document.getElementById("precio1").value);
        let precio2 = parseFloat(document.getElementById("precio2").value);
        let subtotal = precio1 + precio2;

        document.getElementById("subtotal").innerHTML = subtotal;
    }
</script>

</body>
</html>
